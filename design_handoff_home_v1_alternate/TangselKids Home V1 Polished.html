<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TangselKids — Home V1 Polished</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #efeae0; font-family: var(--tk-font); }
  #root { width: 100%; height: 100vh; }
  /* gentle fade-in for the whole prototype */
  @keyframes tkFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .tk-stage { animation: tkFade .5s ease both; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design_handoff_home_redesign/ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="home-v1-polished.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { IOSDevice } = window;
const { HomeV1Polished } = window;
const { TweaksPanel, TweakSection, TweakRadio, TweakToggle, useTweaks } = window;
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "amber",
  "showConfetti": true,
  "frame": "phone"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // apply accent tweak as CSS var override on the iframe root
  useEffect(() => {
    const map = { amber: '#c47a14', rose: '#e26a6a', emerald: '#1f9b6a', violet: '#7a4f9b' };
    document.documentElement.style.setProperty('--tk-accent', map[t.accent] || '#c47a14');
  }, [t.accent]);

  const inner = (
    <div style={{ width: '100%', height: '100%' }}>
      <HomeV1Polished accent={t.accent} showConfetti={t.showConfetti}/>
    </div>
  );

  return (
    <div className="tk-stage" style={{
      width: '100%', height: '100%',
      display: 'flex', justifyContent: 'center', alignItems: 'center',
      padding: 20, boxSizing: 'border-box',
    }}>
      {t.frame === 'phone' ? (
        <IOSDevice width={390} height={844}>{inner}</IOSDevice>
      ) : (
        <div style={{
          width: 390, height: 844, borderRadius: 32, overflow: 'hidden',
          boxShadow: '0 30px 80px rgba(15,23,42,0.18)',
          border: '1px solid rgba(15,23,42,0.1)',
        }}>{inner}</div>
      )}

      <TweaksPanel>
        <TweakSection label="Tampilan"/>
        <TweakRadio label="Accent" value={t.accent}
          options={['amber', 'rose', 'emerald', 'violet']}
          onChange={(v) => setTweak('accent', v)}/>
        <TweakRadio label="Frame" value={t.frame}
          options={['phone', 'plain']}
          onChange={(v) => setTweak('frame', v)}/>
        <TweakSection label="Detail"/>
        <TweakToggle label="Konfeti masthead" value={t.showConfetti}
          onChange={(v) => setTweak('showConfetti', v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
