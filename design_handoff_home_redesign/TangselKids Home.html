<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TangselKids — Home redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { margin: 0; padding: 0; background: #efeae0; font-family: var(--tk-font); }
  #root { width: 100%; height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="variation-a-glass.jsx"></script>
<script type="text/babel" src="variation-b-editorial.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard, DCNote } = window;
const { IOSDevice } = window;
const { VariationAGlass, VariationBEditorial } = window;

// iPhone 14 Pro logical size — but we drop the home indicator in our own
// floating tab bars, and IOSDevice already handles status bar / island.
const PHONE_W = 390;
const PHONE_H = 844;

function PhoneFrame({ children }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', width: '100%', height: '100%' }}>
      <IOSDevice width={PHONE_W} height={PHONE_H}>
        {children}
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="redesign"
        title="TangselKids — Home redesign"
        subtitle="Same content & palette as your current home, modernized surfaces. Two directions side-by-side."
      >
        <DCArtboard
          id="glass"
          label="A · Liquid Glass"
          width={PHONE_W + 60}
          height={PHONE_H + 80}
        >
          <PhoneFrame>
            <VariationAGlass />
          </PhoneFrame>
        </DCArtboard>

        <DCArtboard
          id="editorial"
          label="B · Editorial Chunky"
          width={PHONE_W + 60}
          height={PHONE_H + 80}
        >
          <PhoneFrame>
            <VariationBEditorial />
          </PhoneFrame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
